# =========================================================
# PERFIL DE TESTE (SEM ENVIAR E-MAIL REAL)
# =========================================================
# Usa o Mailpit como SMTP local. O Mailpit é um servidor SMTP
# fake que aceita qualquer mensagem e mostra o e-mail em:
# http://localhost:8025
# Para rodar: mvnw spring-boot:run -Dspring-boot.run.profiles=teste
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false